[package]
name = "azizos-app"
version = "0.1.0"
edition = "2021"
description = "Azizos — Windows 10/11 playbook applicator"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
azizos-engine = { path = "../engine", default-features = false }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
azizos-engine = { path = "../engine" }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
