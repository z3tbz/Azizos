[package]
name = "azizos-engine"
version = "0.1.0"
edition = "2021"
description = "Azizos tweak engine (declarative, resilient, Windows 10/11)"

[lib]
name = "azizos_engine"
path = "src/lib.rs"

[[bin]]
name = "azizos-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Microsoft's safe registry wrapper (thin layer over the Reg* Win32 API).
windows-registry = "0.6.1"
# Raw bindings only (no wrapper cost) — just GetSystemPowerStatus.
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }

